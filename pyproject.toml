[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-guide-skill"
version = "1.0.0"
description = "Cross-agent skill & MCP server: drop any screen recording video path and let your AI agent analyze 3 FPS frames, plan edits, and render narrated HUD-annotated user guide MP4s."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
  "mcp", "agent-skill", "video-guide", "llm-tool",
  "tutorial-automation", "screen-recording", "edge-tts", "hud"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "opencv-python>=4.9",
  "pillow>=10.0",
  "imageio-ffmpeg>=0.4",
  "edge-tts>=6.1",
  "numpy>=1.26",
  "mcp>=1.0",
]

[project.scripts]
video-guide = "video_guide_skill.cli:main"
video-guide-mcp = "video_guide_skill.mcp_entry:main"
video-guide-tool = "tool_executor:main"

[project.urls]
Homepage = "https://github.com/Bikash-Meher/video-guide-skill"
Issues = "https://github.com/Bikash-Meher/video-guide-skill/issues"

[tool.hatch.build.targets.wheel]
only-include = [
  "video_guide_skill",
  "engine.py",
  "auto_recipe.py",
  "tool_executor.py",
  "mcp_server.py",
  "bootstrap.py",
]

[tool.hatch.build.targets.wheel.shared-data]
"SKILL.md" = "share/video-guide-skill/SKILL.md"
"AGENTS.md" = "share/video-guide-skill/AGENTS.md"
"schemas" = "share/video-guide-skill/schemas"
"examples" = "share/video-guide-skill/examples"
"antigravity" = "share/video-guide-skill/antigravity"
