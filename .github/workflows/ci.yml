name: CI — Auto-Setup & Full 3-FPS Pipeline Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bootstrap-and-smoke:
    name: Bootstrap & 3-FPS Pipeline (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run bootstrap.py (auto environment setup)
        run: python bootstrap.py

      - name: Verify console scripts & MCP imports
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            VENV_BIN=".venv/Scripts"
          else
            VENV_BIN=".venv/bin"
          fi
          "$VENV_BIN/python" -c "import mcp_server; print('mcp_server OK')"
          "$VENV_BIN/video-guide" --help >/dev/null
          echo "video-guide CLI OK"

      - name: Offline E2E test — 3 FPS FFmpeg extract -> analyze ALL frames -> storyboard -> recipe scaffold
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            PY=".venv/Scripts/python"
          else
            PY=".venv/bin/python"
          fi
          "$PY" - <<'EOF'
          import json, pathlib, subprocess, tempfile
          import cv2, numpy as np, imageio_ffmpeg
          from tool_executor import TOOLS, extract_frames, scaffold_recipe, validate_recipe

          expected = {
              "create_guide", "extract_frames", "analyze_frames",
              "inspect_frame_slice", "scaffold_recipe", "validate_recipe", "render_guide"
          }
          assert expected == set(TOOLS.keys()), f"Missing tools: {expected - set(TOOLS.keys())}"

          with tempfile.TemporaryDirectory() as tmp:
              tmp_p = pathlib.Path(tmp)
              vid = tmp_p / "demo.mp4"
              ff = imageio_ffmpeg.get_ffmpeg_exe()
              # Generate a 6-second synthetic screen video with 3 distinct color panels (2s each)
              cmd = [
                  ff, "-y",
                  "-f", "lavfi", "-i", "color=c=0x1e293b:s=1280x720:r=15:d=2",
                  "-f", "lavfi", "-i", "color=c=0x0ea5e9:s=1280x720:r=15:d=2",
                  "-f", "lavfi", "-i", "color=c=0x10b981:s=1280x720:r=15:d=2",
                  "-filter_complex", "[0:v][1:v][2:v]concat=n=3:v=1:a=0",
                  "-pix_fmt", "yuv420p", str(vid),
              ]
              subprocess.run(cmd, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

              ext = extract_frames(str(vid), fps=3.0)
              assert ext["success"] and ext["frame_count"] >= 16, f"Extract failed: {ext}"

              scaf = scaffold_recipe(ext["frames_dir"], video_path=str(vid), fps=3.0, app_name="CI Demo")
              assert scaf["success"], scaf
              assert scaf["total_frames_analyzed"] == ext["frame_count"]
              assert len(scaf["storyboard_paths"]) >= 1
              assert pathlib.Path(scaf["storyboard_paths"][0]).exists()

              recipe = json.loads(scaf["recipe_json"])
              assert "timeline_mapping" in recipe and "steps" in recipe
              assert len(recipe["steps"]) >= 2

              # Should reject unresolved [AGENT:] placeholders
              val_draft = validate_recipe(recipe_json=recipe)
              assert not val_draft["valid"], "Draft with placeholders should fail validation"
              print(f"E2E offline smoke test PASSED ({ext['frame_count']} frames analyzed, {len(scaf['storyboard_paths'])} storyboard sheet)")
          EOF

      - name: Validate example recipes structure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            PY=".venv/Scripts/python"
          else
            PY=".venv/bin/python"
          fi
          "$PY" - <<'EOF'
          import json, pathlib
          for ex in pathlib.Path("examples").glob("recipe_*.json"):
              data = json.loads(ex.read_text(encoding="utf-8"))
              assert data.get("timeline_mapping") and data.get("steps"), f"Invalid example: {ex}"
              print(f"Example OK: {ex.name} ({len(data['steps'])} steps)")
          EOF
