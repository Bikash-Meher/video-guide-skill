name: CI — Setup + Smoke Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Test: auto setup works on clone (the main guarantee) ──────────────────
  bootstrap:
    name: Auto-setup on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # bootstrap.py installs uv, creates .venv, installs deps, verifies tools
      - name: Run bootstrap.py (auto setup)
        run: python bootstrap.py

      # Quick sanity: tool_executor dispatches correctly
      - name: Smoke test — validate_recipe tool (schema check only)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            PYTHON=".venv/Scripts/python"
          else
            PYTHON=".venv/bin/python"
          fi
          $PYTHON -c "
          import json, pathlib, sys
          recipe = json.loads(pathlib.Path('examples/recipe_create_exam.json').read_text())
          assert 'timeline_mapping' in recipe
          assert len(recipe['timeline_mapping']) > 0
          print(f'OK — {len(recipe[\"timeline_mapping\"])} steps, voice={recipe.get(\"default_voice\")}')
          "

      # Verify all 5 tools are callable
      - name: Verify 5 tools registered
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            PYTHON=".venv/Scripts/python"
          else
            PYTHON=".venv/bin/python"
          fi
          $PYTHON -c "
          from tool_executor import TOOLS
          expected = {'extract_frames','scaffold_recipe','validate_recipe','render_guide','create_guide'}
          assert expected == set(TOOLS.keys()), f'Missing tools: {expected - set(TOOLS.keys())}'
          print('All 5 tools OK:', list(TOOLS.keys()))
          "

  # ── Test: MCP server imports cleanly ──────────────────────────────────────
  mcp-import:
    name: MCP server import check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run bootstrap.py
        run: python bootstrap.py
      - name: Check mcp_server imports
        run: .venv/bin/python -c "import mcp_server; print('mcp_server OK')"

  # ── Test: setup.sh works on Linux ─────────────────────────────────────────
  setup-sh:
    name: setup.sh on Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run setup.sh
        run: bash setup.sh

  # ── Test: auto_recipe scene detector imports ───────────────────────────────
  scene-detector:
    name: auto_recipe scene detector
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run bootstrap.py
        run: python bootstrap.py
      - name: Import auto_recipe
        run: |
          .venv/bin/python -c "
          from auto_recipe import detect_scenes, scaffold_recipe
          print('auto_recipe OK — scene detector ready')
          "
